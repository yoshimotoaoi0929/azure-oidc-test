name: Azure Login Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Show Azure Account
        run: |
          az account show

      - name: Show Signed In Identity
        run: |
          echo "CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }}"
          az ad sp show --id ${{ secrets.AZURE_CLIENT_ID }}

      - name: Show Resource Groups
        run: |
          az group list -o table
